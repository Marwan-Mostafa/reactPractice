<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marwan Mostafa — Frontend Developer</title>
    <meta name="description" content="Frontend Developer building fast, accessible, responsive interfaces with HTML5, Tailwind CSS, JavaScript and React." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=IBM+Plex+Mono&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <!-- Set theme + language before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          var l = localStorage.getItem("lang") === "ar" ? "ar" : "en";
          var r = document.documentElement;
          r.setAttribute("data-theme", t);
          r.setAttribute("lang", l);
          r.setAttribute("dir", l === "ar" ? "rtl" : "ltr");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
